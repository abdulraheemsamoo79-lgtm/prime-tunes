name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prime-tunes-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # When a version tag like v0.1 is pushed, publish a public GitHub Release
  # with the APK attached (same pattern as PRIME VID VAULT).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: prime-tunes-apk
          path: apk

      - name: Rename APK (stable download URL)
        run: mv apk/app-debug.apk apk/prime-tunes.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/prime-tunes.apk
          generate_release_notes: true
